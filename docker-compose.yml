version: '3.8'

services:
  attendance-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_face_attendance
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      # Mount thư mục dữ liệu để ảnh khuôn mặt và database SQLite không bị mất khi tắt container
      - ./data/faces:/app/data/faces
      - ./models:/app/models
      - ./attendance.db:/app/attendance.db
    # Lưu ý: Nếu chạy trên Linux có webcam cắm trực tiếp cổng USB, bỏ comment dòng dưới:
    # devices:
    #   - "/dev/video0:/dev/video0"